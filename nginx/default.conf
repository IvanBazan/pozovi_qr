server {
    listen 80;
    server_name pozoviqr.ru www.pozoviqr.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name pozoviqr.ru www.pozoviqr.ru;

    ssl_certificate     /etc/letsencrypt/live/pozoviqr.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pozoviqr.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html/public;

    # Статические страницы сайта
    location = / {
        try_files /index.html =404;
    }

    location = /robots.txt { }
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /favicon.svg { access_log off; log_not_found off; }

    # Статические ресурсы страниц: шрифты, логотипы, картинки
    location /assets/ {
        types {
            font/ttf     ttf;
            font/woff2   woff2;
            font/woff    woff;
            image/svg+xml svg;
            image/png    png;
            image/webp   webp;
            image/jpeg   jpg jpeg;
        }
        default_type application/octet-stream;
        access_log off;
        expires 30d;
    }

    # Admin SPA
    location /admin {
        auth_basic           "Admin";
        auth_basic_user_file /etc/nginx/.htpasswd;
        alias /usr/share/nginx/html/admin;
        try_files $uri $uri/ /admin/index.html;
    }

    # API
    location /api/ {
        auth_basic           "Admin";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass         http://app:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Публичные редиректы
    location / {
        proxy_pass         http://app:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 5s;

        # неизвестный слаг -> нормальная страница вместо "404 page not found"
        proxy_intercept_errors on;
        error_page 404 @notfound;
    }

    location @notfound {
        try_files /404.html =404;
    }
}
