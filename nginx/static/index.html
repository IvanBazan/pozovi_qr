<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Турклуб «Позови меня с собой» — контакты</title>
<meta name="description" content="Соцсети туристического клуба «Позови меня с собой»: Телеграм, Ютуб, ВКонтакте, Инстаграм. Основной сайт — pozovi.tours">
<link rel="icon" href="/favicon.ico" sizes="32x32 64x64">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root {
    --bg:        #f4f2e5;
    --ink:       #292e30;
    --dot:       #262a2c;
    --youtube:   #b52624;
    --telegram:  #479ed6;
    --vk:        #4975bb;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex;
    flex-direction: column;
  }
  .sr {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  .bar {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px;
    flex: none;
  }
  .bar a, .bar button {
    display: inline-flex; align-items: center; justify-content: center;
    width: 44px; height: 44px; padding: 0; border: 0; background: none;
    color: var(--ink); cursor: pointer; border-radius: 8px;
  }
  .bar svg { display: block; fill: currentColor; }
  .bar .ic-back { width: 11px; height: 16px; }
  .bar .ic-home { width: 24px; height: 20px; }
  .bar a:hover, .bar button:hover,
  .bar a:focus-visible, .bar button:focus-visible { color: var(--telegram); }

  main {
    flex: 1;
    width: 100%;
    display: flex;
    justify-content: center;
    padding: 6vh 20px 0;
  }
  .nets { width: min(88%, 620px); height: auto; align-self: flex-start; }

  .dot { fill: var(--dot); transition: fill .18s ease; }
  .placeholder { pointer-events: none; }
  .net { cursor: pointer; -webkit-tap-highlight-color: transparent; outline: none; }
  .n-youtube:hover   .dot, .n-youtube:focus-visible   .dot { fill: var(--youtube); }
  .n-telegram:hover  .dot, .n-telegram:focus-visible  .dot { fill: var(--telegram); }
  .n-vk:hover        .dot, .n-vk:focus-visible        .dot { fill: var(--vk); }
  .n-instagram:hover .dot, .n-instagram:focus-visible .dot { fill: url(#ig-gradient); }

  @media (prefers-reduced-motion: reduce) { .dot { transition: none; } }
</style>
</head>
<body>

<header class="bar">
  <button type="button" id="back" aria-label="Назад">
    <svg class="ic-back" viewBox="16 76 11 16" aria-hidden="true"><path d="M26.5467 90.12L20.44 84L26.5467 77.88L24.6667 76L16.6667 84L24.6667 92L26.5467 90.12Z"/></svg>
  </button>
  <a href="https://pozovi.tours/" aria-label="На сайт турклуба">
    <svg class="ic-home" viewBox="347 71 28 24" aria-hidden="true"><path d="M358.333 94.6667V86.6667H363.667V94.6667H370.333V84H374.333L361 72L347.667 84H351.667V94.6667H358.333Z"/></svg>
  </a>
</header>

<main>
  <h1 class="sr">Турклуб «Позови меня с собой» — соцсети</h1>
  <svg class="nets" viewBox="0 0 500 320" role="group" aria-label="Соцсети турклуба">

        <stop offset="0%"   stop-color="#e9a43f"/>
        <stop offset="28%"  stop-color="#e0462a"/>
        <stop offset="60%"  stop-color="#b30e61"/>
        <stop offset="80%"  stop-color="#900b8d"/>
        <stop offset="100%" stop-color="#5426c7"/>
      </linearGradient>
    </defs>
    <a class="net n-youtube" href="https://www.youtube.com/@tkpozovi" target="_blank" rel="noopener noreferrer" aria-label="Ютуб"><circle class="dot" cx="73" cy="125" r="72"/><path transform="translate(32.68 84.68) scale(3.3600)" fill="var(--bg)" fill-rule="evenodd" d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8zM9.6 15.6V8.4l6.2 3.6-6.2 3.6z"/></a>
    <a class="net n-telegram" href="https://t.me/tkpozovi" target="_blank" rel="noopener noreferrer" aria-label="Телеграм"><circle class="dot" cx="250" cy="90" r="90"/><path transform="translate(199.60 39.60) scale(4.2000)" fill="var(--bg)" d="M23.1 3.3 19.6 20c-.3 1.2-1 1.5-2 .9l-5.5-4-2.6 2.5c-.3.3-.6.6-1.1.6l.4-5.6L18.9 6c.4-.4-.1-.6-.7-.2L6.6 13.1 1.2 11.4c-1.2-.4-1.2-1.2.2-1.7L21.6 2c1-.4 1.8.2 1.5 1.3z"/></a>
    <a class="net n-vk" href="https://vk.ru/club47911435" target="_blank" rel="noopener noreferrer" aria-label="Вконтакте"><circle class="dot" cx="428" cy="125" r="70"/><path transform="translate(388.80 85.80) scale(3.2667)" fill="var(--bg)" d="M12.8 18.4c-6.1 0-9.9-4.2-10-11.2h3.1c.1 5.1 2.4 7.3 4.2 7.8V7.2h2.9v4.4c1.7-.2 3.6-2.2 4.2-4.4h2.9c-.5 2.7-2.4 4.7-3.8 5.5 1.4.7 3.6 2.5 4.5 5.7h-3.2c-.7-2.1-2.4-3.8-4.6-4.1v4.1h-.2z"/></a>
    <a class="net n-instagram" href="https://www.instagram.com/pozovi_tour" target="_blank" rel="noopener noreferrer" aria-label="Инстаграм"><circle class="dot" cx="188" cy="260" r="53"/><g transform="translate(158.32 230.32) scale(2.4733)" fill="none" stroke="var(--bg)" stroke-width="2"><rect x="2.6" y="2.6" width="18.8" height="18.8" rx="5.6"/><circle cx="12" cy="12" r="4.8"/><circle cx="17.6" cy="6.4" r="1.3" fill="var(--bg)" stroke="none"/></g></a>
    <circle class="dot placeholder" cx="318" cy="260" r="55" aria-hidden="true"/>
  </svg>
</main>

<script>
  document.getElementById('back').addEventListener('click', function () {
    if (history.length > 1) { history.back(); } else { location.href = 'https://pozovi.tours/'; }
  });
</script>

</body>
</html>
